<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Link Detection System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 8px;
    }

    .header p {
      color: #8b949e;
      font-size: 14px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #f0f6fc;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #58a6ff;
    }

    button {
      background: #238636;
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #2ea043;
    }

    /* Result Banner */
    .result-box {
      display: none;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .result-phishing {
      display: block;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #ff7b72;
    }

    .result-safe {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid #2ea043;
      color: #3fb950;
    }

    /* Quick Test List */
    .sample-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #21262d;
    }

    .sample-section h3 {
      font-size: 13px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .sample-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .sample-link-btn {
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }

    .sample-link-btn:hover {
      background: #30363d;
      color: #c9d1d9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Phishing Link Detection</h1>
      <p>Enter any URL to instantly verify link authenticity</p>
    </div>

    <div class="input-box">
      <input type="text" id="urlInput" placeholder="Paste link here..." autocomplete="off" />
      <button onclick="checkLink()">Detect Link</button>
    </div>

    <!-- Output Banner -->
    <div id="resultBox" class="result-box"></div>

    <div class="sample-section">
      <h3>Quick Test Links (Click to test)</h3>
      <div class="sample-links" id="sampleContainer">
        <button class="sample-link-btn" type="button" data-url="https://www.google.com">https://www.google.com (Legitimate)</button>
        <button class="sample-link-btn" type="button" data-url="http://paypal.example.com.login.example/verify">http://paypal.example.com.login.example/verify</button>
        <button class="sample-link-btn" type="button" data-url="http://192.0.2.10/login">http://192.0.2.10/login</button>
        <button class="sample-link-btn" type="button" data-url="http://free-gift.example/winner">http://free-gift.example/winner</button>
      </div>
    </div>
  </div>

  <script>
    async function checkLink() {
      const input = document.getElementById("urlInput").value;
      const resultBox = document.getElementById("resultBox");

      if (!input.trim()) {
        resultBox.className = "result-box";
        resultBox.style.display = "none";
        return;
      }

      resultBox.className = "result-box";
      resultBox.style.display = "block";
      resultBox.textContent = "Analyzing URL...";

      try {
        const response = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: input.trim() })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || "Prediction failed");
        }

        if (data.prediction === 1) {
          resultBox.className = "result-box result-phishing";
          resultBox.textContent = "Phishing link detected (" + data.confidence + "% confidence)";
        } else {
          resultBox.className = "result-box result-safe";
          resultBox.textContent = "Legitimate link (" + data.confidence + "% confidence)";
        }
      } catch (error) {
        resultBox.className = "result-box";
        resultBox.style.display = "block";
        resultBox.style.border = "1px solid #d29922";
        resultBox.style.color = "#d29922";
        resultBox.textContent = error.message;
      }
    }

    // Trigger on Enter key
    document.getElementById("urlInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        checkLink();
      }
    });

    document.querySelectorAll("[data-url]").forEach(function(button) {
      button.addEventListener("click", function() {
        document.getElementById("urlInput").value = button.dataset.url;
        checkLink();
      });
    });
  </script>

</body>
</html>
